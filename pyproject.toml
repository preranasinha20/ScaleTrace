[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaletrace"
version = "0.1.0"
description = "Research prototype that combines static and runtime evidence to diagnose scalability risks in Python/FastAPI backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Controlled runtime testing (Phase 4). Only needed when executing a target application.
runtime = [
    "httpx>=0.27",
    "psutil>=5.9",
    "uvicorn>=0.30",
]
# Needed to *run* the demo applications in examples/ (static analysis never imports them).
demo = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "requests>=2.31",
]
# Deep-learning root-cause ranking (CPU is enough). Install torch from https://pytorch.org for your platform.
ml = [
    "torch>=2.2",
    "numpy>=1.26",
]
# Optional pretrained code-Transformer embeddings for the GNN (`--embedder codebert`).
ml-pretrained = [
    "transformers>=4.40",
]
ui = [
    "streamlit>=1.35",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
scaletrace = "scaletrace.cli:main"

[tool.setuptools.packages.find]
include = ["scaletrace*"]

[tool.setuptools.package-data]
"scaletrace.rules" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["runtime: executes a demo application in a subprocess (deselect with -m 'not runtime')"]
